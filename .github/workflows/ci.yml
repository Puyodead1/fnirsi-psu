name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pyserial==3.5
      - run: python -m unittest discover -s tests -v

  bundle:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to attach the bundle to tagged releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/build_mcpb.py
      - name: Test the packed bundle
        run: |
          mkdir -p build/unpacked
          python -c "import zipfile,glob; zipfile.ZipFile(glob.glob('dist/*.mcpb')[0]).extractall('build/unpacked')"
          FNIRSI_EXT_DIR=build/unpacked python -m unittest tests.test_mcp_server -v
      - uses: actions/upload-artifact@v4
        with:
          name: fnirsi-psu-mcpb
          path: dist/*.mcpb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mcpb
